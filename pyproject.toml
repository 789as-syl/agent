[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-base-agent"
version = "0.1.0"
description = "Knowledge Base Question Answering System with RAG"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis[hiredis]>=5.2.0",
    "minio>=7.2.0",
    "celery[redis]>=5.4.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.17",
    "openpyxl>=3.1.0",
    "beautifulsoup4>=4.14.0",
    "docling>=2.91.0",
    "llama-index-core>=0.14.0",
    "llama-index-readers-file>=0.5.0",
    "dashscope>=1.20.0",
    "langchain>=1.2.15",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=3.0.5",
    "pypdf>=6.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "psycopg[binary]>=3.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
    "types-redis>=4.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "RUF"]
ignore = [
    # Chinese product copy and documentation intentionally use full-width punctuation.
    # Keep Ruff useful by enforcing correctness/import/bug-risk rules without turning
    # CJK prose into the dominant lint signal.
    "RUF001",
    "RUF002",
    "RUF003",
    # Black owns line wrapping. E501 is noisy for CJK text, long SQL, and generated HTML/CSS
    # literals in the current codebase, so it is tracked in docs rather than used as a hard gate.
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
exclude = [
    "^app/tests/",
]

[[tool.mypy.overrides]]
module = [
    "bs4",
    "celery.*",
    "dashscope",
    "dashscope.*",
    "docling.*",
    "docling_core.*",
    "jose",
    "langchain.*",
    "langgraph.checkpoint.postgres.*",
    "minio.*",
    "pgvector.*",
    "pypdf",
    "psycopg",
    "psycopg.*",
    "psycopg_pool",
    "redis.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"
cache_dir = "tmp/pytest_cache"
addopts = "-p no:cacheprovider"
filterwarnings = [
    "ignore::DeprecationWarning",
]
